name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check safety boundaries
        run: npm run check:boundaries

      - name: Check version consistency
        run: npm run check:versions

      - name: Build
        run: npm run build

      - name: Check committed bundle
        run: git diff --exit-code -- main.js
