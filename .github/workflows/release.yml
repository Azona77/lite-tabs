name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and attest"
        required: true
        default: "1.4.0"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check safety boundaries
        run: npm run check:boundaries

      - name: Test
        run: npm test

      - name: Check version consistency
        run: npm run check:versions

      - name: Build
        run: npm run build

      - name: Validate release version
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          node -e "const m=require('./manifest.json'); if (m.version !== process.argv[1]) { throw new Error('manifest version ' + m.version + ' does not match tag ' + process.argv[1]); }" "$version"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Lite Tabs 1.4.0

          ### English

          - Refined the toolbar into prominent Layout and Display order controls with a quieter More menu.
          - Added reverse display ordering with a low-friction right-click shortcut and menu/settings toggle.
          - Added a List gap setting and improved the active-tab accent border.

          ### 中文

          - 优化工具栏排布，突出 Layout 与 Display order，并将低频操作收纳到 More 菜单。
          - 添加逆向排序，可通过排序按钮右键、More 菜单或设置页切换。
          - 添加 List gap 设置，并优化当前标签的四边高亮边框。
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Lite Tabs ${TAG#v}" \
              --notes-file release-notes.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" main.js manifest.json styles.css --clobber --repo "$GITHUB_REPOSITORY"

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
