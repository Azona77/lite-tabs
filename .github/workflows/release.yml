name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and attest"
        required: true
        default: "1.2.0"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check safety boundaries
        run: npm run check:boundaries

      - name: Build
        run: npm run build

      - name: Validate release version
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          node -e "const m=require('./manifest.json'); if (m.version !== process.argv[1]) { throw new Error('manifest version ' + m.version + ' does not match tag ' + process.argv[1]); }" "$version"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## English

          ### New

          - Added mobile drag handles with an option to hide them.
          - Mobile bottom stacking is enabled by default for new users.

          ### Improved

          - Card and Masonry mobile drag handles now use a left-side vertical grip to avoid blocking vertical scrolling.
          - Card and Masonry views keep close buttons visible on mobile.
          - Bottom alignment now works with normal scrolling by measuring visible content and adding spacer only when content does not overflow.

          ### Fixed

          - Fixed Card and Masonry title width after adding drag handles.
          - Fixed inconsistent mobile scrolling after switching layouts.
          - Reduced conflicts between drag handles and the sidebar swipe gesture.

          ### Notes

          - Desktop behavior is unchanged.

          ## 中文

          ### 新增

          - 新增移动端拖动手柄显示开关。
          - 新用户默认开启移动端底部堆叠。

          ### 改进

          - 卡片和瀑布流视图的移动端拖动手柄改为左侧竖向区域，减少对上下滑动的干扰。
          - 卡片和瀑布流视图在移动端常驻显示关闭按钮。
          - 底部对齐改为按可见内容测量，只在内容未溢出时补齐空间，兼容正常滚动。

          ### 修复

          - 修复加入手柄后卡片和瀑布流标题宽度异常。
          - 修复移动端切换视图后滚动偶发卡在底部的问题。
          - 降低拖动手柄与侧边栏横滑收起手势的冲突。

          ### 说明

          - 桌面端行为保持不变。
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Lite Tabs ${TAG#v}" \
              --notes-file release-notes.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" main.js manifest.json styles.css --clobber --repo "$GITHUB_REPOSITORY"

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
