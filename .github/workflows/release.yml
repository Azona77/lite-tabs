name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and attest"
        required: true
        default: "1.3.0"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check safety boundaries
        run: npm run check:boundaries

      - name: Build
        run: npm run build

      - name: Validate release version
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          node -e "const m=require('./manifest.json'); if (m.version !== process.argv[1]) { throw new Error('manifest version ' + m.version + ' does not match tag ' + process.argv[1]); }" "$version"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## 中文

          本次更新完善了 Masonry 视图的分组体验，并增加固定标签页与搜索增强功能。

          ### 新增

          - Masonry 视图支持与 Card 视图一致的分组分隔显示。
          - 新增右键固定/取消固定标签页。
          - 搜索框支持按 Enter 激活第一个匹配标签页。
          - 搜索匹配文本高亮显示。

          ### 改进

          - 优化 Masonry 分组拖放区域，减少跨组排序误判。
          - 稳定 Masonry 刷新布局，降低拖放后的卡片跳动。
          - 固定标签页新增折角标记，并在 hover 时显示取消固定按钮。
          - 优化标签页关闭/固定按钮的浮现动画。
          - 改进图标与标题在不同字号下的纵向对齐。

          ## English

          This update improves grouped Masonry behavior and adds pinned tabs plus richer search interactions.

          ### New

          - Added group separators to Masonry view, matching Card view behavior.
          - Added context-menu actions to pin and unpin tabs.
          - Search now activates the first matching tab with Enter.
          - Search matches are highlighted in tab titles.

          ### Improved

          - Improved Masonry drag-and-drop hit areas around groups.
          - Stabilized Masonry layout refreshes to reduce card jumping after drops.
          - Added a corner ribbon marker for pinned tabs, with hover-to-unpin behavior.
          - Refined close/pin button reveal animations.
          - Improved vertical alignment between tab icons and titles across font sizes.
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Lite Tabs ${TAG#v}" \
              --notes-file release-notes.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" main.js manifest.json styles.css --clobber --repo "$GITHUB_REPOSITORY"

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
