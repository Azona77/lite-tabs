name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and attest"
        required: true
        default: "1.1.0"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check safety boundaries
        run: npm run check:boundaries

      - name: Build
        run: npm run build

      - name: Validate release version
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          node -e "const m=require('./manifest.json'); if (m.version !== process.argv[1]) { throw new Error('manifest version ' + m.version + ' does not match tag ' + process.argv[1]); }" "$version"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## English

          ### New

          - Added a masonry-style tab layout.
          - Masonry cards automatically adapt their height to tab title length.

          ### Improved

          - Refined drag-and-drop behavior for masonry cards.
          - Added clearer drop indicators for masonry sorting.
          - Added short post-drop visual feedback so the moved tab is easier to locate after layout reflow.
          - Kept masonry dependency-free, using measured CSS grid spans and batched refreshes.

          ### Notes

          - Existing List and Card layouts remain unchanged.
          - Masonry uses existing card-related appearance settings, including card width, font size, and gap.
          - No vault file access, network access, clipboard access, or persistent layout cache was added.

          ## 中文

          ### 新增

          - 新增瀑布流标签页布局。
          - 瀑布流卡片会根据标签标题长度自动调整高度。

          ### 改进

          - 优化瀑布流卡片的拖动排序行为。
          - 改进瀑布流排序时的落点提示。
          - 新增短暂的拖动完成反馈，便于在布局重排后定位被移动的标签。
          - 瀑布流实现不引入新依赖，使用测量后的 CSS grid span 与合并刷新。

          ### 说明

          - 现有列表和卡片布局保持不变。
          - 瀑布流复用现有卡片相关外观设置，包括卡片宽度、字体大小和间距。
          - 本版本未新增仓库文件访问、网络访问、剪贴板访问或持久布局缓存。
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Lite Tabs ${TAG#v}" \
              --notes-file release-notes.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" main.js manifest.json styles.css --clobber --repo "$GITHUB_REPOSITORY"

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
